services:
  # ---------------------------------------------------------------------------
  # MediConsent Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: mediconsent-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_NAME
        value: mediconsent
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: AUTH_COOKIE_NAME
        value: mediconsent_token
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: CHAIN_ID
        value: 31337

  # ---------------------------------------------------------------------------
  # MediConsent Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: mediconsent-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_CHAIN_ID
        value: 31337
      - key: VITE_CONTRACT_ADDRESS
        sync: false
